server:
  port: ${PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: criba
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/criba;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 101MB
  jackson:
    default-property-inclusion: non_null

criba:
  jwt-secret: ${JWT_SECRET:}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

logging:
  level:
    org.hibernate.SQL: warn
